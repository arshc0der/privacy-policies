<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Privacy Policies</title>

    <meta name="description"
          content="Privacy policies for our mobile applications.">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        p {
            line-height: 1.6;
            color: #555;
        }

        .app-list {
            margin-top: 30px;
        }

        .app {
            display: block;
            padding: 18px 20px;
            margin-bottom: 12px;
            background: #f1f4f9;
            border-radius: 8px;
            color: #1565c0;
            text-decoration: none;
            font-weight: 600;
        }

        .app:hover {
            background: #e4eaf3;
        }

        footer {
            margin-top: 35px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Privacy Policies</h1>

            <p>
                Welcome. This page contains privacy policies for our
                mobile applications.
            </p>

            <div class="app-list">

                <!-- BabyBoss Privacy Policy -->
                <a class="app" href="babyboss/">
                    BabyBoss — Privacy Policy
                </a>

                <!--
                Add additional apps like this:

                <a class="app" href="my-app/">
                    My App — Privacy Policy
                </a>
                -->

            </div>

            <footer>
                © 2026. All rights reserved.
            </footer>

        </div>

    </div>

</body>
</html>
